# Almacenamiento: Hetzner Object Storage (S3-compatible, `fsn1.your-objectstorage.com`),
# bucket `erplora-saas` (privado, layout por prefijos — ADR-0099 / infra/OBJECT-STORAGE.md):
#   img/         librería WebP compartida (la lista el SaaS: /api/v1/catalog/assets/)
#   starter-seeds/  bundles seed por <país>/<sector> (ADR-0072)
# Sustituye a AWS S3/OIDC (AWS apagado). Credenciales estáticas en secrets del repo:
# HETZNER_S3_ACCESS_KEY · HETZNER_S3_SECRET_KEY · HETZNER_S3_ENDPOINT.
name: Sync assets to Object Storage

on:
  push:
    branches: [main]
    paths:
      - 'img/**'
      - 'starter_catalogs/**'
  workflow_dispatch:

jobs:
  sync:
    # Corre en `ci-runner-1` (Hetzner, self-hosted) si la Variable `CI_RUNNER_LABEL` está puesta
    # a nivel de org, y en los runners de GitHub si no. El 2026-08-11 la org agotó el presupuesto
    # de Actions y los jobs dejaron de ARRANCAR: rojo en 2 s, sin una línea de log. Aquí eso deja
    # los blueprints sin publicar en Object Storage, que es de donde los instalan los hubs.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: fsn1
      S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate assets before sync
        run: |
          pip install pillow
          python scripts/validate_assets.py img

      - name: Sync WebP assets to Object Storage
        run: |
          aws s3 sync img/ s3://erplora-saas/img/ \
            --endpoint-url "$S3_ENDPOINT" \
            --delete \
            --exclude "*" \
            --include "*.webp" \
            --cache-control "max-age=86400" \
            --content-type "image/webp"
          echo "Synced $(find img -name '*.webp' | wc -l) WebP files to s3://erplora-saas/img/"

      # Starter seeds (ADR-0072): bundles `starter_catalogs/<país>/<sector>/{seed.sql,seed.sha256,seed.json}`
      # → S3 `starter-seeds/<país>/<sector>/`. El Hub los descarga, verifica el SHA256 y aplica el seed.
      - name: Verify seed.sha256 integrity (no drift) before publishing
        run: |
          fail=0
          for seed in starter_catalogs/*/*/seed.sql; do
            dir=$(dirname "$seed")
            expected=$(cat "$dir/seed.sha256" | tr -d '[:space:]')
            actual=$(sha256sum "$seed" | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "::error::sha256 drift en $seed ($actual != $expected) — regenera el bundle"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "All seed.sha256 match their seed.sql."
          exit $fail

      - name: Sync starter seeds to Object Storage
        run: |
          # Imágenes NO van aquí (libería compartida en img/, §7.3); solo seed.{sql,sha256,json}.
          aws s3 sync starter_catalogs/ s3://erplora-saas/starter-seeds/ \
            --endpoint-url "$S3_ENDPOINT" \
            --delete \
            --exclude "*" \
            --include "*/*/seed.sql" \
            --include "*/*/seed.sha256" \
            --include "*/*/seed.json"
          echo "Synced $(find starter_catalogs -name 'seed.sql' | wc -l) starter seed bundles to s3://erplora-saas/starter-seeds/"
