# Almacenamiento: Hetzner Object Storage (S3-compatible, `fsn1.your-objectstorage.com`),
# bucket `erplora-saas` (privado, layout por prefijos — ADR-0099 / infra/OBJECT-STORAGE.md):
#   img/         librería WebP compartida (la lista el SaaS: /api/v1/catalog/assets/)
# Los starter seeds (`starter-seeds/`) van en su PROPIO workflow (`publish-seeds.yml`): así un merge
# de `starter_catalogs/**` NUNCA ejecuta un sync sobre la librería compartida (blueprints#21).
# Sustituye a AWS S3/OIDC (AWS apagado). Credenciales estáticas en secrets del repo:
# HETZNER_S3_ACCESS_KEY · HETZNER_S3_SECRET_KEY · HETZNER_S3_ENDPOINT.
#
# 🔴 SIN `--delete` a propósito (blueprints#21, ADR-0134). Los starter catalogs y los blueprints
# referencian estas rutas por nombre y el SaaS las sirve en /api/v1/catalog/assets/: un asset que
# falte en el checkout (renombrado, subido por otra vía, borrado por accidente) NO debe desaparecer
# del bucket por un push. Este workflow solo AÑADE/ACTUALIZA. La poda es una operación manual y
# explícita (`workflow_dispatch` con `prune=true`), que primero enseña qué borraría y aborta si
# supera el umbral.
name: Sync assets to Object Storage

on:
  push:
    branches: [main]
    paths:
      - 'img/**'
      - '.github/workflows/publish-to-s3.yml'
  workflow_dispatch:
    inputs:
      prune:
        description: 'Prune bucket objects that no longer exist under img/ (destructive, dry-run + threshold first)'
        type: boolean
        default: false
      max_prune:
        description: 'Abort the prune if it would delete more than this many objects'
        type: number
        default: 5

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: fsn1
      S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate assets before sync
        run: |
          pip install pillow
          python scripts/validate_assets.py img

      - name: Sync WebP assets to Object Storage (add/update only, never delete)
        run: |
          aws s3 sync img/ s3://erplora-saas/img/ \
            --endpoint-url "$S3_ENDPOINT" \
            --exclude "*" \
            --include "*.webp" \
            --cache-control "max-age=86400" \
            --content-type "image/webp"
          echo "Synced $(find img -name '*.webp' | wc -l) WebP files to s3://erplora-saas/img/"

      - name: Prune orphan assets (explicit, dry-run + threshold)
        if: github.event_name == 'workflow_dispatch' && inputs.prune
        env:
          MAX_PRUNE: ${{ inputs.max_prune }}
        run: |
          plan=$(aws s3 sync img/ s3://erplora-saas/img/ \
            --endpoint-url "$S3_ENDPOINT" \
            --delete --dryrun \
            --exclude "*" \
            --include "*.webp" | grep -E '^\(dryrun\) delete:' || true)
          count=$(printf '%s' "$plan" | grep -c . || true)
          echo "Objects that would be deleted: $count"
          printf '%s\n' "$plan"
          if [ "$count" -eq 0 ]; then
            echo "Nothing to prune."
            exit 0
          fi
          if [ "$count" -gt "${MAX_PRUNE:-5}" ]; then
            echo "::error::Prune would delete $count objects (> max_prune=${MAX_PRUNE:-5}). Aborting."
            exit 1
          fi
          aws s3 sync img/ s3://erplora-saas/img/ \
            --endpoint-url "$S3_ENDPOINT" \
            --delete \
            --exclude "*" \
            --include "*.webp" \
            --cache-control "max-age=86400" \
            --content-type "image/webp"
          echo "Pruned $count orphan objects from s3://erplora-saas/img/"
