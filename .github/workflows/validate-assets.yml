name: Validate assets

on:
  pull_request:
    paths:
      - 'img/**'
      - 'scripts/validate_assets.py'
      - '.github/workflows/validate-assets.yml'
  push:
    branches: [main]
    paths:
      - 'img/**'
      - 'scripts/validate_assets.py'
      - '.github/workflows/validate-assets.yml'
  workflow_dispatch:

jobs:
  validate:
    # Corre en `ci-runner-1` (Hetzner, self-hosted) si la Variable `CI_RUNNER_LABEL` está puesta
    # a nivel de org, y en los runners de GitHub si no. El 2026-08-11 la org agotó el presupuesto
    # de Actions y los jobs dejaron de ARRANCAR: rojo en 2 s, sin una línea de log. Aquí eso deja
    # los blueprints sin publicar en Object Storage, que es de donde los instalan los hubs.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Validate assets (WebP 512x512, snake_case, solo WebP)
        run: python scripts/validate_assets.py img
